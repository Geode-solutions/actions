on:
  workflow_call:
    inputs:
      use_internal:
        type: boolean
        default: false
    outputs:
      changes_detected:
        description: "commit has been done"
        value: ${{ jobs.prepare.outputs.changes_detected }}
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
      - name: "Get config files"
        id: config
        uses: Geode-solutions/actions/install/config-files@master
        with:
          files: |
            commitlint.config.js commitlint.config.js
            .releaserc .releaserc
            .oxlintrc.json .oxlintrc.json
      - name: oxfmt
        run: npx oxfmt .
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          commit_message: Apply prepare changes
