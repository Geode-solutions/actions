on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      google:
        type: boolean
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      LICENSE_TOKEN:
        required: false
      GOOGLE_CLOUD_KEY:
        required: false
      GOOGLE_CLOUD_PROJECT_ID:
        required: false

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
      - name: GitHub Packages Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}
      - name: Log in to Google Artifact Registry
        if: ${{ inputs.google }}
        uses: docker/login-action@v3
        with:
          registry: europe-west9-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GOOGLE_CLOUD_KEY }}
      - name: Build docker
        uses: Geode-solutions/actions/build/docker@master
        id: docker
        with:
          tag: ${{ inputs.tag }}
          license_token: ${{ secrets.LICENSE_TOKEN }}
      - name: Push Docker image to ghcr.io
        run: docker push ${{ steps.docker.outputs.image }}
      - name: Tag and push to Google Artifact Registry
        if: ${{ inputs.google }}
        run: |
          REPO=${{ github.event.repository.name }}
          repo=${REPO,,}
          GAR_FULL_IMAGE="europe-west9-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}/github/$repo:${{ inputs.tag }}"
          echo "Tagging image for GAR: $GAR_FULL_IMAGE"
          docker tag ${{ steps.docker.outputs.image }} $GAR_FULL_IMAGE
          docker push $GAR_FULL_IMAGE