name: "Test Desktop"
description: "Test Desktop"

inputs:
  name:
    type: string
    default: "results"
  repos:
    type: string
  branch:
    type: string
  tarballs:
    type: string
  pyinstallers:
    type: string
  use_registry:
    type: boolean
    required: true
  token:
    type: string
    required: true
  shard_index:
    description: "1-based index of the Playwright shard to run, empty to run every test"
    type: string
  shard_total:
    type: string
  prebuilt:
    description: "node_modules and the unpacked app in release/0.0.0 are already extracted (see web-test-desktop.yml)"
    type: boolean
    default: false
  AZURE_KEY_VAULT_URI:
    type: string
  AZURE_CLIENT_ID:
    type: string
  AZURE_TENANT_ID:
    type: string
  AZURE_CLIENT_SECRET:
    type: string
  AZURE_CERT_NAME:
    type: string

runs:
  using: "composite"
  steps:
    # Same version as install/node-dependencies, which built the extracted node_modules
    - uses: actions/setup-node@v6
      if: ${{ inputs.prebuilt == 'true' }}
      with:
        node-version: 24
    - name: Install dependencies
      if: ${{ inputs.prebuilt != 'true' }}
      uses: Geode-solutions/actions/install/node-dependencies@master
      with:
        repos: ${{ inputs.repos }}
        branch: ${{ inputs.branch }}
        token: ${{ inputs.token }}
        tarballs: ${{ inputs.tarballs }}
        use_registry: ${{ inputs.use_registry }}
    - name: Install Microservices
      if: ${{ inputs.use_registry == 'false' && inputs.prebuilt != 'true' }}
      uses: Geode-solutions/actions/install/microservices@master
      with:
        repos: ${{ inputs.repos }}
        branch: ${{ inputs.branch }}
        token: ${{ inputs.token }}
        pyinstallers: ${{ inputs.pyinstallers }}
    - name: Install Azure Sign Tool
      if: ${{ inputs.use_registry == 'false' && inputs.prebuilt != 'true' }}
      uses: Geode-solutions/actions/install/azure-sign@master
    - name: Install OSMesa
      uses: Geode-solutions/actions/install/osmesa@master
    - name: Install desktop app
      if: ${{ inputs.use_registry == 'true' }}
      uses: Geode-solutions/actions/install/desktop@master
      with:
        branch: ${{ inputs.branch }}
        token: ${{ inputs.token }}
    # Electron is driven directly: no Playwright browser is needed, only the Linux system libraries it shares with Chromium
    - name: Install Playwright
      uses: Geode-solutions/actions/install/playwright@master
      with:
        deps_only: true
    - name: Build
      if: ${{ inputs.use_registry == 'false' && inputs.prebuilt != 'true' }}
      run: |
        npm run build:desktop:unpacked
      shell: bash
      env:
        AZURE_KEY_VAULT_URI: ${{ inputs.AZURE_KEY_VAULT_URI }}
        AZURE_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET: ${{ inputs.AZURE_CLIENT_SECRET }}
        AZURE_CERT_NAME: ${{ inputs.AZURE_CERT_NAME }}
    - name: Shard arguments
      id: shard
      run: |
        if [ -n "${{ inputs.shard_index }}" ]; then
          echo "args=-- --shard=${{ inputs.shard_index }}/${{ inputs.shard_total }}" >> "$GITHUB_OUTPUT"
          echo "suffix=-${{ inputs.shard_index }}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - name: Test on Linux
      if: runner.os == 'Linux'
      run: |
        if [ -f "./release/0.0.0/linux-unpacked/chrome-sandbox" ]; then
          sudo chown root:root ./release/0.0.0/linux-unpacked/chrome-sandbox
          sudo chmod 4755 ./release/0.0.0/linux-unpacked/chrome-sandbox
        fi
        xvfb-run -n 99 --server-args="-screen 0 1280x960x24" npm run test:e2e:desktop ${{ steps.shard.outputs.args }}
      shell: bash
      env:
        DESKTOP_EXECUTABLE_PATH: "${{ github.workspace }}/desktop_app"
    - name: Test on Windows
      if: runner.os == 'Windows'
      run: |
        npm run test:e2e:desktop ${{ steps.shard.outputs.args }}
      shell: bash
      env:
        DESKTOP_EXECUTABLE_PATH: "${{ github.workspace }}/desktop_app"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-${{ inputs.name }}-desktop-${{ runner.os }}${{ steps.shard.outputs.suffix }}
        path: playwright-report/
        overwrite: true
