on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      light:
        type: boolean
        default: false
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      shards:
        type: number
        default: 2
    secrets:
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  setup-windows-shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set shards matrix
        id: set-matrix
        run: |
          echo "matrix=$(jq -cn --argjson shards ${{ inputs.shards }} '{shard: [range(1; $shards + 1)]}')" >> $GITHUB_OUTPUT

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ secrets.TOKEN }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          token: ${{ secrets.TOKEN }}
          branch: ${{ inputs.branch }}
          system: win64
      - name: Libraries
        id: libraries
        run: |
          $old_path = "${{ steps.repos.outputs.path }}"
          $bin_path = $old_path.replace(";", "\bin;")
          echo "bin=$bin_path" >> $env:GITHUB_OUTPUT
          $share_path = $old_path.replace(";", "\share;")
          echo "share=$share_path" >> $env:GITHUB_OUTPUT
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile
        run: |
          if(!(test-path build)) { mkdir build }
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DBUILD_SHARED_LIBS:BOOL=ON -DCMAKE_PREFIX_PATH="${{ steps.repos.outputs.path }}" ..
          cmake --build . -t third_party
          cd ${{ inputs.directory }}
          $paths = "${{ steps.libraries.outputs.bin }}"
          echo $paths
          Foreach($path in $paths.split(";")){
            if(Test-Path -Path $path) {
              Copy-Item -Path $path\* -Destination bin
            }
          }
          if(!(test-path share)) {
            mkdir share
          }
          $shares = "${{ steps.libraries.outputs.share }}"
          echo $shares
          Foreach($share in $shares.split(";")){
            if(Test-Path -Path $share) {
              Copy-Item -Path $share\* -Destination share -Recurse -Force
            }
          }
          cmake --build . -j 2
          cmake --build . -t install
          $count = (ctest -N -L essential | Select-String "^Total Tests: (\d+)").Matches.Groups[1].Value
          echo "Essential tests: $count"
          if(!$count -or [int]$count -eq 0) {
            echo "No essential tests found"
            exit 1
          }
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
      - name: Upload tests
        uses: actions/upload-artifact@v7
        with:
          name: cpp-tests-win64
          path: |
            build
            !build/**/CMakeFiles
            !build/**/*.obj
            !build/**/*.ilk
            !build/**/*.lib
            !build/**/.ninja_*
          retention-days: 1
          overwrite: true

  test-windows:
    runs-on: windows-2022
    needs: [setup-windows-shards, build-windows]
    strategy:
      matrix: ${{ fromJson(needs.setup-windows-shards.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ secrets.TOKEN }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        with:
          repos: ${{ inputs.repos }}
          token: ${{ secrets.TOKEN }}
          branch: ${{ inputs.branch }}
          system: win64
      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: cpp-tests-win64
          path: build
      - name: Test (shard ${{ matrix.shard }}/${{ inputs.shards }})
        run: |
          cd build/${{ inputs.directory }}
          ctest --output-on-failure --stop-on-failure --no-tests=ignore -j $env:NUMBER_OF_PROCESSORS -L essential -I ${{ matrix.shard }},,${{ inputs.shards }}
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
