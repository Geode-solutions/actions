on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true

jobs:
  semantic-release:
    uses: Geode-solutions/actions/.github/workflows/release.yml@master
    with:
      dry_run: true
    secrets: inherit

  sleep:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Wait for registry to update
        uses: Geode-solutions/actions/wait-registry@master
        with:
          registry: pypi
          token: ${{ steps.token.outputs.token }}

  prepare:
    needs: sleep
    uses: Geode-solutions/actions/.github/workflows/py-prepare.yml@master
    with:
      use_internal: true
      repos: ${{ vars.REPOS }}
    secrets: inherit
