name: "Install C++ dependencies"
description: "Install C++ dependencies"

inputs:
  repos:
    type: string
    required: true
  branch:
    type: string
    required: true
  system:
    type: string
    required: true
  token:
    type: string
    required: true
  save:
    type: boolean
    default: true
  cache-suffix:
    description: "appended to the cache key, e.g. to separate caches by Python version"
    type: string
    default: ""
  releases:
    description: "selection output of get-release, skips the release lookup"
    type: string
    default: ""
outputs:
  path:
    value: ${{ steps.repos.outputs.path }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.save && runner.environment == 'github-hosted' }}
      uses: actions/cache@v4
      with:
        path: build/third_party
        key: ${{ inputs.system }}${{ inputs.cache-suffix }}-${{ hashFiles('cmake/Configure**.cmake') }}
    - if: ${{ !inputs.save && runner.environment == 'github-hosted' }}
      uses: actions/cache/restore@v4
      with:
        path: build/third_party
        key: ${{ inputs.system }}${{ inputs.cache-suffix }}-${{ hashFiles('cmake/Configure**.cmake') }}
    - run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "ext=zip" >> $GITHUB_ENV
        else
          echo "ext=tar.gz" >> $GITHUB_ENV
        fi
      shell: bash
    - uses: Geode-solutions/actions/get-release@master
      id: repos
      with:
        repository: ${{ inputs.repos }}
        file: "-${{ inputs.system }}-private.${{ env.ext }}"
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        selection: ${{ inputs.releases }}
