on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: "master"
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          skip_dirty_check: true
          commit_message: "fix(Package): trigger new release"
          commit_options: "--allow-empty"
      - uses: actions/github-script@v8
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: 'Geode-solutions',
              repo: 'Versions',
              workflow_id: 'deploy.yml',
              ref: 'master',
              inputs: { branch: '${{ inputs.branch }}', workflow: 'cpp' }
            })
