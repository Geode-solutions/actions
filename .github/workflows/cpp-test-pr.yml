on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      python:
        type: boolean
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      GEODE_CI_LICENSE:
        required: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: Geode-solutions/actions/.github/workflows/cpp-prepare.yml@master
    secrets: inherit

  # Prerelease "<branch>" receiving the packages of the Debug builds below: downstream PRs on the
  # same branch and the Versions branch check (both building Debug tests) install them
  release:
    needs: prepare
    uses: Geode-solutions/actions/.github/workflows/dev-release.yml@master

  test-repository:
    needs: [prepare, release]
    uses: Geode-solutions/actions/.github/workflows/cpp-test-repository.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      light: true
      branch: ${{ github.event.pull_request.head.ref }}
      python: ${{ inputs.python }}
      package: ${{ github.head_ref }}-tag
    secrets: inherit

  semantic-commit:
    needs: prepare
    uses: Geode-solutions/actions/.github/workflows/semantic-commit.yml@master
    secrets: inherit

  # Last job, once tests, packages and commit checks succeeded. Its job ids keep the check name
  # required by the repositories branch protection: "test / deploy-repository / notify / notify"
  deploy-repository:
    needs: [test-repository, semantic-commit]
    if: ${{ !failure() && !cancelled() }}
    uses: Geode-solutions/actions/.github/workflows/cpp-test-pr-notify.yml@master
    secrets: inherit
