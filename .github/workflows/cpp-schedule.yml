on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      branch:
        type: string
        default: "master"
      python:
        type: boolean
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GEODE_CI_LICENSE:
        required: false

jobs:
  # Skips the tests when neither the repository nor its dependency releases changed since the
  # last green run, scheduled or dispatched (Versions dispatches the master tests every night).
  # The fingerprint is made of git trees, shared by master and next: the master test runs only
  # when the sources differ.
  # Every Sunday and every re-run test anyway (toolchain, runner, re-uploaded assets)
  changes:
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.decide.outputs.run }}
      key: ${{ steps.fingerprint.outputs.key }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - uses: Geode-solutions/actions/get-release@master
        id: releases
        with:
          repository: ${{ inputs.repos }}
          file: "."
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          download: false
      - name: Fingerprint
        uses: Geode-solutions/actions/schedule-fingerprint@master
        id: fingerprint
        with:
          branch: ${{ inputs.branch }}
          selection: ${{ steps.releases.outputs.selection }}
          token: ${{ steps.token.outputs.token }}
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: schedule-fingerprint
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.run_attempt }}" != "1" ] || [ "$(date -u +%u)" == "7" ] || [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Same repository and dependencies as the last green run: skip"
            echo "run=false" >> $GITHUB_OUTPUT
          fi

  test-repository:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: Geode-solutions/actions/.github/workflows/cpp-test-repository.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      light: true
      type: "Release"
      # Nobody waits on the nightly tests: one build and test job per system, no shard overhead
      shards: 1
      branch: ${{ inputs.branch }}
      wheels_from_pypi: true
      python: ${{ inputs.python }}
    secrets: inherit

  save-fingerprint:
    needs: [changes, test-repository]
    if: needs.test-repository.result == 'success' && needs.changes.outputs.cache-hit != 'true'
    runs-on: ubuntu-slim
    steps:
      - run: echo "${{ needs.changes.outputs.key }}" > schedule-fingerprint
      - uses: actions/cache/save@v4
        with:
          path: schedule-fingerprint
          key: ${{ needs.changes.outputs.key }}

  notify:
    runs-on: ubuntu-slim
    if: ${{ always() && needs.test-repository.result == 'failure' }}
    needs: test-repository
    steps:
      - name: Notify slack
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
