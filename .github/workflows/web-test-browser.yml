on:
  workflow_call:
    inputs:
      repos:
        type: string
      branch:
        type: string
        default: ${{ github.ref_name }}
      use_registry:
        type: boolean
        default: false
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true

jobs:
  # Built workspace (node_modules, microservices, build output) shared by the test shards
  build-browser:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - parallel:
          - name: Install dependencies
            uses: Geode-solutions/actions/install/node-dependencies@master
            with:
              repos: ${{ inputs.repos }}
              branch: ${{ inputs.branch }}
              token: ${{ steps.token.outputs.token }}
              use_registry: ${{ inputs.use_registry }}
          - name: Install Microservices
            uses: Geode-solutions/actions/install/microservices@master
            with:
              repos: ${{ inputs.repos }}
              branch: ${{ inputs.branch }}
              token: ${{ steps.token.outputs.token }}
      - name: Build
        run: |
          npm run build:browser
        shell: bash
      # The whole workspace, as build outputs differ between repositories; tar keeps executable bits and symlinks.
      # Written outside the workspace, otherwise tar fails because the archived directory changes while it is read
      - name: Archive
        run: |
          tar --exclude=./.git -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/browser-build.tar.zst"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: browser-build-${{ runner.os }}
          path: ${{ runner.temp }}/browser-build.tar.zst
          retention-days: 1
          compression-level: 0

  test-browser:
    needs: build-browser
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        shard: [1, 2, 3]
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: browser-build-${{ runner.os }}
      - name: Extract
        run: |
          tar --use-compress-program "zstd -d" -xf browser-build.tar.zst
          rm browser-build.tar.zst
        shell: bash
      - name: Test Browser
        uses: Geode-solutions/actions/test/browser@master
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ steps.token.outputs.token }}
          use_registry: ${{ inputs.use_registry }}
          shard_index: ${{ matrix.shard }}
          shard_total: 3
          prebuilt: true
