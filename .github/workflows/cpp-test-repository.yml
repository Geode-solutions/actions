on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      light:
        type: boolean
        default: false
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      wheels_from_pypi:
        type: boolean
        default: false
      python:
        type: boolean
        default: true
      shards:
        type: number
        default: 2
      package:
        description: "release receiving the packages of the builds (none when empty)"
        type: string
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GEODE_CI_LICENSE:
        required: false

jobs:
  # Release lookup done once for all jobs, instead of once per job and per dependency.
  # Also builds the job matrices: a dedicated job would bill one more minute per run
  releases:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.releases.outputs.selection }}
      linux: ${{ steps.matrices.outputs.linux }}
      linux_tests: ${{ steps.matrices.outputs.linux_tests }}
      windows_tests: ${{ steps.matrices.outputs.windows_tests }}
    steps:
      - name: Matrices
        id: matrices
        run: |
          if [ "${{ inputs.light }}" == "true" ]; then
            # Exclude rhel when light is true
            systems='[{"system":"ubuntu","cc":"/usr/bin/clang","cxx":"/usr/bin/clang++"}]'
          else
            # Include both rhel and ubuntu
            systems='[{"system":"rhel","cc":"/opt/rh/gcc-toolset-14/root/usr/bin/gcc","cxx":"/opt/rh/gcc-toolset-14/root/usr/bin/g++"},{"system":"ubuntu","cc":"/usr/bin/clang","cxx":"/usr/bin/clang++"}]'
          fi
          echo "linux={\"include\":$systems}" >> $GITHUB_OUTPUT
          echo "linux_tests=$(echo "$systems" | jq -c --argjson shards ${{ inputs.shards }} '{include: [.[] as $s | range(1; $shards + 1) | $s + {shard: .}]}')" >> $GITHUB_OUTPUT
          echo "windows_tests=$(jq -cn --argjson shards ${{ inputs.shards }} '{shard: [range(1; $shards + 1)]}')" >> $GITHUB_OUTPUT
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - uses: Geode-solutions/actions/get-release@master
        id: releases
        with:
          repository: ${{ inputs.repos }}
          file: "-private."
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          download: false

  test-linux:
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-test-linux.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      type: ${{ inputs.type }}
      branch: ${{ inputs.branch }}
      package: ${{ inputs.package }}
      shards: ${{ inputs.shards }}
      matrix: ${{ needs.releases.outputs.linux }}
      test_matrix: ${{ needs.releases.outputs.linux_tests }}
    secrets: inherit

  test-linux-python:
    if: ${{ inputs.python }}
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-test-linux-python.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      light: ${{ inputs.light }}
      type: ${{ inputs.type }}
      branch: ${{ inputs.branch }}
      package: ${{ inputs.package }}
      wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
    secrets: inherit

  test-windows:
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-test-windows.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      type: ${{ inputs.type }}
      branch: ${{ inputs.branch }}
      package: ${{ inputs.package }}
      shards: ${{ inputs.shards }}
      test_matrix: ${{ needs.releases.outputs.windows_tests }}
    secrets: inherit

  test-windows-python:
    if: ${{ inputs.python }}
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-test-windows-python.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      light: ${{ inputs.light }}
      type: ${{ inputs.type }}
      branch: ${{ inputs.branch }}
      package: ${{ inputs.package }}
      wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
    secrets: inherit
