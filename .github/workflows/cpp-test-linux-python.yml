on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      light:
        type: boolean
        default: false
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      wheels_from_pypi:
        type: boolean
        default: false
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
      package:
        description: "release receiving the packages of the build (none when empty)"
        type: string
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GEODE_CI_LICENSE:
        required: false

# Optimized test builds keeping assertions (NDEBUG undefined), see OpenGeode cmake/CppTargets.cmake
env:
  GEODE_CI_DEBUG_FLAGS: "-O2 -D_GLIBCXX_ASSERTIONS"

jobs:
  linux-python:
    runs-on: ubuntu-24.04
    container: "ghcr.io/geode-solutions/rhel:master"
    strategy:
      matrix:
        python: ["3.14"]
    env:
      CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Get info
        id: info
        run: |
          echo "tag=cp${{ matrix.python }}-cp${{ matrix.python }}" | sed 's/\.//g' >> $GITHUB_OUTPUT
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: rhel
          save: false
      - name: Libraries
        id: libraries
        run: |
          new_path=$(echo "${{ steps.repos.outputs.path }}" | sed 's/\;/\/lib64\:/g')
          echo "LD_LIBRARY_PATH=$new_path" >> $GITHUB_ENV
          echo "PATH=/opt/python/${{ steps.info.outputs.tag }}/bin:$PATH" >> $GITHUB_ENV
      - uses: Geode-solutions/actions/get-release@master
        if: ${{ !inputs.wheels_from_pypi }}
        id: wheels
        with:
          repository: ${{ inputs.repos }}
          file: "-${{ steps.info.outputs.tag }}-manylinux_2_28_x86_64.whl"
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: "pip-compile"
        run: |
          file=bindings/python/requirements.in
          if [ ! -f "$file" ]; then 
            exit 0
          fi
          pip install pip-tools typing_extensions
          if [ ${{ inputs.branch }} == "master" ]; then
            pip-compile -v --upgrade $file
          else
            pip-compile -v --pre --upgrade $file
          fi
          sed -i -E 's/==(.+)\.(.+)\.(.+)/==\1\.*,>=\1\.\2\.\3/' bindings/python/requirements.txt
      - name: Wheels from Github
        if: ${{ !inputs.wheels_from_pypi }}
        run: |
          wheels=$(echo "${{ steps.wheels.outputs.path }}" | sed 's/\;/\ /g')
          echo $wheels
          if [ -n "$wheels" ]; then 
            pip install --no-deps $wheels
          fi
      - name: Wheels from Pypi
        if: ${{ inputs.wheels_from_pypi }}
        run: |
          requirements="bindings/python/requirements.txt"
          if [ -f "$requirements" ]; then 
            pip install --pre -r $requirements
          fi
      - name: Compile
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DCMAKE_PREFIX_PATH="${{ steps.repos.outputs.path }}" -D${{ inputs.name }}_WITH_PYTHON:BOOL=ON -DPYTHON_VERSION:STRING=${{ matrix.python }} -DCPACK_PACKAGE_VERSION:STRING=0.0.0 -DCPACK_SYSTEM_NAME:STRING=rhel ${{ inputs.package != '' && '-DWHEEL_VERSION:STRING=0.0.0' || '' }} ..
          cmake --build .
          cd ${{ inputs.directory }}
          echo "Python testing"
          ctest --output-on-failure --stop-on-failure -R py -j 2
          echo "LD_LIBRARY_PATH=" >> $GITHUB_ENV
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Wheels from Github in venv
        if: ${{ !inputs.wheels_from_pypi }}
        run: |
          wheels=$(echo "${{ steps.wheels.outputs.path }}" | sed 's/\;/\ /g')
          echo $wheels
          if [ -n "$wheels" ]; then 
            build/${{ inputs.directory }}/wheel/venv/bin/pip install --no-deps $wheels
          fi
      - name: Wheels from Pypi in venv
        if: ${{ inputs.wheels_from_pypi }}
        run: |
          requirements="bindings/python/requirements.txt"
          if [ -f "$requirements" ]; then
            # A dependency released moments ago may not be served by every PyPI CDN node yet
            # (index pages are cached up to 10 min): retry, bypassing pip's cache
            pip="build/${{ inputs.directory }}/wheel/venv/bin/pip"
            attempt=1
            until $pip install --pre $([ $attempt -gt 1 ] && echo --no-cache-dir) -r $requirements; do
              if [ $attempt -ge 5 ]; then
                echo "pip install failed after $attempt attempts"
                exit 1
              fi
              echo "pip install failed (attempt $attempt/5), retrying in 60s..."
              sleep 60
              attempt=$((attempt + 1))
            done
          fi
      - name: Compile wheel
        run: |
          cd build/${{ inputs.directory }}
          cmake --build . --target wheel
          cmake --build . --target test-wheel
      # Same rhel private package and wheel as cpp-deploy-linux.yml and cpp-deploy-linux-python.yml,
      # from this build: downstream python tests install them
      - name: Package
        if: ${{ inputs.package != '' }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          cd build/${{ inputs.directory }}
          cpack -D CPACK_COMPONENTS_ALL="public;private" .
          for file in *.tar.gz
          do
            mv $file $(echo $file | sed 's/\.tar\.gz/\-private\.tar\.gz/g')
          done
          rm -rf _CPack_Packages
          (cd wheel/dist && rename linux manylinux_2_28 *.whl)
          for file in *-private.tar.gz wheel/dist/*.whl
          do
            counter=0
            for i in 1 2 3 4 5; do gh release upload --clobber --repo $GITHUB_REPOSITORY ${{ inputs.package }} $file && break || counter=$[$counter +1] && sleep 30; done
            if [ "$counter" -eq "5" ]; then exit 1; fi
          done
          rm *-private.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
