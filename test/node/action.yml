name: "Test Node"
description: "Run the Node tests, and optionally pack the package for release-node"

inputs:
  repos:
    type: string
  branch:
    type: string
  tarballs:
    type: string
  use_registry:
    type: boolean
    required: true
  token:
    type: string
    required: true
  pack:
    description: "Build and pack the package as the node-package artifact, reused by release-node in web-deploy-repository.yml"
    type: boolean
    default: false

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      uses: Geode-solutions/actions/install/node-dependencies@master
      with:
        repos: ${{ inputs.repos }}
        branch: ${{ inputs.branch }}
        tarballs: ${{ inputs.tarballs }}
        token: ${{ inputs.token }}
        use_registry: ${{ inputs.use_registry }}
    - name: Run tests
      run: |
        npm run test
      shell: bash
    # Package files are listed in package.json "files", so test outputs cannot end up in it
    - name: Pack
      if: ${{ inputs.pack == 'true' }}
      run: |
        npm run build
        mkdir -p "$RUNNER_TEMP/node-package"
        npm pack --pack-destination "$RUNNER_TEMP/node-package"
      shell: bash
    - uses: actions/upload-artifact@v7
      if: ${{ inputs.pack == 'true' }}
      with:
        name: node-package
        path: ${{ runner.temp }}/node-package/*.tgz
        retention-days: 1
        if-no-files-found: error
