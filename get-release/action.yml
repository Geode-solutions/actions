name: "Download GitHub Release"
description: "Download Github Release"
inputs:
  repository:
    description: 'GitHub repository name (ex: owner/repo, owner default value is Geode-solutions). You can provide a list of values separated by a ";" '
    required: true
  file:
    description: "regex of the file to download"
    required: true
  token:
    description: "Github token"
    required: true
  branch:
    description: "branch name"
    required: false
    default: "master"
  base:
    description: "base name"
    required: false
    default: ""
  directory:
    description: "directory name"
    required: false
    default: ${{ github.workspace }}
  download:
    description: "false only lists the selected releases in the releases output"
    required: false
    default: "true"
outputs:
  path:
    description: "path of the extracted asset"
  releases:
    description: "repo:release_id:newest asset update of each selected release, separated by ;"
runs:
  using: "node24"
  main: "index.js"
