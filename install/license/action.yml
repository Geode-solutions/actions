name: "Install License"

inputs:
  license:
    description: "Content of the Geode license file"
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Write license
      run: |
        if [ -z "$LICENSE" ]; then
          echo "::error::The license input is empty: is the GEODE_CI_LICENSE secret defined and passed to this workflow?"
          exit 1
        fi
        printf '%s\n' "$LICENSE" > "$GITHUB_WORKSPACE/geode.lic"
      shell: bash
      env:
        LICENSE: ${{ inputs.license }}
