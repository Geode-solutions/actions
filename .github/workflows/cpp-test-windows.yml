on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      shards:
        type: number
        default: 2
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
      package:
        description: "release receiving the packages of the build (none when empty)"
        type: string
        default: ""
      test_matrix:
        description: "test matrix (shards), built by cpp-test-repository.yml"
        type: string
        required: true
      python:
        description: "also build and test the Python bindings and the wheel, in the build job"
        type: boolean
        default: false
      wheels_from_pypi:
        type: boolean
        default: false
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GEODE_CI_LICENSE:
        required: false

# Optimized test builds keeping assertions (NDEBUG undefined), see OpenGeode cmake/CppTargets.cmake
env:
  GEODE_CI_DEBUG_FLAGS: "/O2"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      # Before the dependencies: their third_party cache is keyed by the exact Python version
      - name: Python
        if: ${{ inputs.python }}
        uses: Geode-solutions/actions/install/cpp-python-test-dependencies@perf/windows-test-python-in-build
        id: python
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ steps.token.outputs.token }}
          wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: win64
          cache-suffix: ${{ inputs.python && format('-py{0}', steps.python.outputs.python-version) || '' }}
      - name: Libraries
        id: libraries
        run: |
          $old_path = "${{ steps.repos.outputs.path }}"
          $bin_path = $old_path.replace(";", "\bin;")
          echo "bin=$bin_path" >> $env:GITHUB_OUTPUT
          $share_path = $old_path.replace(";", "\share;")
          echo "share=$share_path" >> $env:GITHUB_OUTPUT
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if(!(test-path build)) { mkdir build }
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DBUILD_SHARED_LIBS:BOOL=ON -DINCLUDE_PYBIND11:BOOL=ON -DCMAKE_PREFIX_PATH="${{ steps.repos.outputs.path }}" -DCPACK_PACKAGE_VERSION:STRING=0.0.0 -DCPACK_SYSTEM_NAME:STRING=win64 ${{ inputs.python && format('-D{0}_WITH_PYTHON:BOOL=ON -DPYTHON_VERSION:STRING=3.14', inputs.name) || '' }} ${{ inputs.python && inputs.package != '' && '-DWHEEL_VERSION:STRING=0.0.0' || '' }} ..
          cmake --build . -t third_party
          cd ${{ inputs.directory }}
          $paths = "${{ steps.libraries.outputs.bin }}"
          echo $paths
          Foreach($path in $paths.split(";")){
            if(Test-Path -Path $path) {
              Copy-Item -Path $path\* -Destination bin
            }
          }
          if(!(test-path share)) {
            mkdir share
          }
          $shares = "${{ steps.libraries.outputs.share }}"
          echo $shares
          Foreach($share in $shares.split(";")){
            if(Test-Path -Path $share) {
              Copy-Item -Path $share\* -Destination share -Recurse -Force
            }
          }
          cmake --build . -t essential -j 2
          $count = (ctest -N -L essential | Select-String "^Total Tests: (\d+)").Matches.Groups[1].Value
          echo "Essential tests: $count"
          if(!$count -or [int]$count -eq 0) {
            echo "No essential tests found"
            exit 1
          }
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Compile Python
        if: ${{ inputs.python }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd build/${{ inputs.directory }}
          # Modules imported by the Python tests and packaged in the wheel (also built by the
          # essential target with recent OpenGeode releases)
          cmake --build . -t bindings/python/all -j 2
          # Superbuild: the wheel is made from the install folder
          if ("${{ inputs.directory }}" -ne ".") {
            cmake --install .
          }
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Wheels from Github in venv
        if: ${{ inputs.python && !inputs.wheels_from_pypi }}
        run: |
          $wheels ="${{ steps.python.outputs.wheels }}"
          if($wheels) {
            Foreach($wheel in $wheels.split(";")){
              build/${{ inputs.directory }}/wheel/venv/Scripts/pip install --no-deps $wheel
            }
          }
      - name: Wheels from Pypi in venv
        if: ${{ inputs.python && inputs.wheels_from_pypi }}
        run: |
          $requirements = "bindings/python/requirements.txt"
          if(test-path -Path $requirements -PathType Leaf) {
            # A dependency released moments ago may not be served by every PyPI CDN node yet
            # (index pages are cached up to 10 min): retry, bypassing pip's cache
            $pip = "build/${{ inputs.directory }}/wheel/venv/Scripts/pip"
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              if ($attempt -eq 1) { & $pip install --pre -r $requirements }
              else { & $pip install --pre --no-cache-dir -r $requirements }
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 5) { Write-Output "pip install failed after $attempt attempts"; exit 1 }
              Write-Output "pip install failed (attempt $attempt/5), retrying in 60s..."
              Start-Sleep -Seconds 60
            }
          }
      # Python tests without the essential label (OpenGeode releases before the label): the test
      # shards run the labelled ones. Their stub gates fail on Windows (DLLs not found, fixed with
      # the label), so a failure is only a warning, as before
      - name: Python tests
        if: ${{ inputs.python }}
        run: |
          cd build/${{ inputs.directory }}
          ctest --output-on-failure -R -py- -LE essential -j 2
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Python tests failed (not labelled essential, see the log)"
          }
          exit 0
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Wheel
        if: ${{ inputs.python }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd build/${{ inputs.directory }}
          cmake --build . --target wheel
          cmake --build . --target test-wheel
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      # Same private package as cpp-deploy-windows.yml (unsigned), from this build
      - name: Package
        if: ${{ inputs.package != '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd build/${{ inputs.directory }}
          cpack -D CPACK_COMPONENTS_ALL="public;private"
          Get-ChildItem *.zip | Foreach-Object {
            $private = $_.Name.Replace(".zip", "-private.zip")
            Rename-Item $_.FullName $private
            gh release upload --clobber --repo ${env:GITHUB_REPOSITORY} ${{ inputs.package }} $private
            Remove-Item $private
          }
          Remove-Item -Recurse -Force _CPack_Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Same wheel as cpp-deploy-windows-python.yml, from this build: downstream python tests install it
      - name: Package wheel
        if: ${{ inputs.python && inputs.package != '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem -Path "build/${{ inputs.directory }}/wheel/dist" -Filter *.whl | Foreach-Object { gh release upload --clobber --repo ${env:GITHUB_REPOSITORY} ${{ inputs.package }} $_.FullName }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A single shard runs in the build job: a test job would repeat the checkout and dependencies
      # setup and transfer the tests as an artifact
      - name: Test
        if: ${{ inputs.shards == 1 }}
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: 1
          shards: 1
          directory: build/${{ inputs.directory }}
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Upload tests
        if: ${{ inputs.shards > 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-tests-win64
          path: |
            build
            !build/**/CMakeFiles
            !build/**/*.obj
            !build/**/*.ilk
            !build/**/*.lib
            !build/**/.ninja_*
            !build/**/wheel
          retention-days: 1
          overwrite: true

  test-windows:
    if: ${{ inputs.shards > 1 }}
    runs-on: windows-2022
    needs: build-windows
    strategy:
      matrix: ${{ fromJson(inputs.test_matrix) }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      # The Python test environment uploaded with the tests is based on this Python
      - name: Python
        if: ${{ inputs.python }}
        uses: Geode-solutions/actions/install/cpp-python-test-dependencies@perf/windows-test-python-in-build
        id: python
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ steps.token.outputs.token }}
          wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: win64
          cache-suffix: ${{ inputs.python && format('-py{0}', steps.python.outputs.python-version) || '' }}
      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: cpp-tests-win64
          path: build
      - name: Test
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: ${{ matrix.shard }}
          shards: ${{ inputs.shards }}
          directory: build/${{ inputs.directory }}
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
