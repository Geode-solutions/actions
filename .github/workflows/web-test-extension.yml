on:
  workflow_call:
    inputs:
      repos:
        type: string
      branch:
        type: string
        default: ${{ github.ref_name }}
      use_registry:
        type: boolean
        default: false
    secrets:
      TOKEN:
        required: true

jobs:
  # Built workspace (node_modules, microservices, packaged extension) shared by the test shards,
  # and the packaged extension alone for release-extension in web-deploy-repository.yml
  build-extension:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ secrets.TOKEN }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/node-dependencies@master
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ secrets.TOKEN }}
          use_registry: ${{ inputs.use_registry }}
      - name: Install Microservices
        uses: Geode-solutions/actions/install/microservices@master
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ secrets.TOKEN }}
      - name: Build
        run: |
          npm run package
        shell: bash
      # The whole workspace, as the tests need more than the package; tar keeps executable bits and symlinks.
      # Written outside the workspace, otherwise tar fails because the archived directory changes while it is read
      - name: Archive
        run: |
          tar --exclude=./.git -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/extension-build.tar.zst"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: extension-build-${{ runner.os }}
          path: ${{ runner.temp }}/extension-build.tar.zst
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ runner.os }}
          path: "*.vext"
          retention-days: 1
          if-no-files-found: error

  test-extension:
    needs: build-extension
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
        shard: [1, 2, 3]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-build-${{ runner.os }}
      - name: Extract
        run: |
          tar --use-compress-program "zstd -d" -xf extension-build.tar.zst
          rm extension-build.tar.zst
        shell: bash
      - name: Test Extension
        uses: Geode-solutions/actions/test/extension@master
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ secrets.TOKEN }}
          use_registry: ${{ inputs.use_registry }}
          shard_index: ${{ matrix.shard }}
          shard_total: 3
          prebuilt: true
