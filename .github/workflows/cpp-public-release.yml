on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - uses: Geode-solutions/actions/public-release@master
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Notify slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
