on:
  workflow_call:
    inputs:
      repos:
        type: string
        required: true
      use_internal:
        type: boolean
        default: false
      branch:
        type: string
        default: ${{ github.ref_name }}
    outputs:
      changes_detected:
        description: "commit has been done"
        value: ${{ jobs.prepare.outputs.changes_detected }}
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: pip-compile
        uses: Geode-solutions/actions/install/pip-compile@master
        with:
          folders: .
          use_internal: ${{ inputs.use_internal }}
          token: ${{ steps.token.outputs.token }}
      - name: "Get config files"
        uses: Geode-solutions/actions/install/config-files@master
        with:
          files: |
            commitlint.config.js commitlint.config.js
            .releaserc .releaserc
            mypy.ini mypy.ini
            ruff.toml ruff.toml
      - name: Ruff
        run: |
          pip install ruff
          ruff format .
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        uses: Geode-solutions/actions/install/node-dependencies@master
        with:
          repos: ${{ inputs.repos }}
          branch: ${{ inputs.branch }}
          token: ${{ steps.token.outputs.token }}
          use_registry: false
      - name: Json & Discard dependency install changes
        if: hashFiles('package.json') != ''
        run: |
          npm run json
          git checkout -- package.json
          rm -f -- ./*.tgz
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          commit_message: Apply prepare changes
