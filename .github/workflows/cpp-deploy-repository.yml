on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      version:
        type: string
        required: true
      light:
        type: boolean
        default: false
      release:
        type: string
        required: true
      wheels_from_pypi:
        type: boolean
        default: false
      upload-pypi:
        type: boolean
        default: true
      python:
        type: boolean
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      PYPI_TOKEN:
        required: true

jobs:
  # Release lookup done once for all jobs, instead of once per job and per dependency
  releases:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.releases.outputs.selection }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - uses: Geode-solutions/actions/get-release@master
        id: releases
        with:
          repository: ${{ inputs.repos }}
          file: "-private."
          token: ${{ steps.token.outputs.token }}
          branch: ${{ github.ref_name }}
          download: false

  release-linux:
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-deploy-linux.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
    secrets: inherit

  release-linux-python:
    if: ${{ inputs.python }}
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-deploy-linux-python.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
      upload-pypi: ${{ inputs.upload-pypi }}
      light: ${{ inputs.light || github.ref_name != 'master' }}
      wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
    secrets: inherit

  release-windows:
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-deploy-windows.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
    secrets: inherit

  release-windows-python:
    if: ${{ inputs.python }}
    needs: releases
    uses: Geode-solutions/actions/.github/workflows/cpp-deploy-windows-python.yml@master
    with:
      name: ${{ inputs.name }}
      directory: ${{ inputs.directory }}
      repos: ${{ inputs.repos }}
      releases: ${{ needs.releases.outputs.selection }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
      upload-pypi: ${{ inputs.upload-pypi }}
      light: ${{ inputs.light || github.ref_name != 'master' }}
      wheels_from_pypi: ${{ inputs.wheels_from_pypi }}
    secrets: inherit
