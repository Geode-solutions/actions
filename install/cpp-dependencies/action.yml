name: "Install C++ dependencies"
description: "Install C++ dependencies"

inputs:
  repos:
    type: string
    required: true
  branch:
    type: string
    required: true
  system:
    type: string
    required: true
  token:
    type: string
    required: true
  save:
    type: boolean
    default: true
  cache-suffix:
    description: "appended to the cache key, e.g. to separate caches by Python version"
    type: string
    default: ""
  releases:
    description: "selection output of get-release, skips the release lookup"
    type: string
    default: ""
outputs:
  path:
    value: ${{ steps.repos.outputs.path }}

runs:
  using: "composite"
  steps:
    # The third-party build trees embed the toolchain (CMake path and version,
    # compilers, system): a container image update must not reuse them, e.g.
    # OpenSSL refuses to build when its sources look newer than its configuration.
    - id: toolchain
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        {
          cmake_path=$(command -v cmake || true)
          echo "cmake: $cmake_path"
          [ -n "$cmake_path" ] && readlink -f "$cmake_path" && cmake --version | head -1
          [ -n "${CC:-}" ] && "$CC" --version 2>&1 | head -1
          [ -n "${CXX:-}" ] && "$CXX" --version 2>&1 | head -1
          cat /etc/os-release 2>/dev/null
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "image: ${ImageOS:-} ${ImageVersion:-}"
          fi
        } > "$RUNNER_TEMP/toolchain.txt" || true
        cat "$RUNNER_TEMP/toolchain.txt"
        echo "hash=$(sha256sum "$RUNNER_TEMP/toolchain.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.save && runner.environment == 'github-hosted' }}
      uses: actions/cache@v4
      with:
        path: build/third_party
        key: ${{ inputs.system }}${{ inputs.cache-suffix }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('cmake/Configure**.cmake') }}
    - if: ${{ !inputs.save && runner.environment == 'github-hosted' }}
      uses: actions/cache/restore@v4
      with:
        path: build/third_party
        key: ${{ inputs.system }}${{ inputs.cache-suffix }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('cmake/Configure**.cmake') }}
    - run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "ext=zip" >> $GITHUB_ENV
        else
          echo "ext=tar.gz" >> $GITHUB_ENV
        fi
      shell: bash
    - uses: Geode-solutions/actions/get-release@master
      id: repos
      with:
        repository: ${{ inputs.repos }}
        file: "-${{ inputs.system }}-private.${{ env.ext }}"
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        selection: ${{ inputs.releases }}
