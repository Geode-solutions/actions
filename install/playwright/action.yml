name: "Install Playwright"

inputs:
  browsers:
    description: "Space separated list of Playwright browsers to install"
    type: string
    default: "chromium"

runs:
  using: "composite"
  steps:
    - name: Get Playwright cache info
      id: info
      run: |
        version=$(npx playwright --version | awk '{print $2}')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        case "${{ runner.os }}" in
          Windows) echo "path=$LOCALAPPDATA\\ms-playwright" >> "$GITHUB_OUTPUT" ;;
          macOS) echo "path=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
          *) echo "path=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
        esac
      shell: bash
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ${{ steps.info.outputs.path }}
        key: playwright-${{ runner.os }}-${{ steps.info.outputs.version }}-${{ inputs.browsers }}
    # Always run: browsers already in cache are skipped, system dependencies are still installed on Linux
    - name: Install Playwright
      run: npx playwright install ${{ inputs.browsers }} --with-deps
      shell: bash
