on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      version:
        type: string
        required: true
      light:
        type: boolean
        default: false
      release:
        type: string
        required: true
      wheels_from_pypi:
        type: boolean
        default: false
      upload-pypi:
        type: boolean
        default: true
      branch:
        type: string
        default: ${{ github.ref_name }}
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
      combined:
        description: "one job compiling the C++ libraries once for every Python version (wheels from PyPI only)"
        type: boolean
        default: false
      upload-github:
        description: "upload the wheels to the GitHub release (the combined job uploads an artifact instead)"
        type: boolean
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      PYPI_TOKEN:
        required: true

jobs:
  # One job per Python version, each compiling the C++ libraries
  linux-python:
    if: ${{ !inputs.combined }}
    runs-on: ubuntu-24.04
    container: "ghcr.io/geode-solutions/rhel:master"
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - python: ${{ inputs.light && '3.10' || 'dummy' }}
          - python: ${{ inputs.light && '3.11' || 'dummy' }}
          - python: ${{ inputs.light && '3.12' || 'dummy' }}
          - python: ${{ inputs.light && '3.13' || 'dummy' }}
    env:
      CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Get info
        id: info
        run: |
          echo "tag=cp${{ matrix.python }}-cp${{ matrix.python }}" | sed 's/\.//g' >> $GITHUB_OUTPUT
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: rhel
          save: false
      - name: Libraries
        id: libraries
        run: |
          new_path=$(echo "${{ steps.repos.outputs.path }}" | sed 's/\;/\/lib64\:/g')
          echo "LD_LIBRARY_PATH=$new_path" >> $GITHUB_ENV
          echo "PATH=/opt/python/${{ steps.info.outputs.tag }}/bin:$PATH" >> $GITHUB_ENV
      - uses: Geode-solutions/actions/get-release@master
        if: ${{ !inputs.wheels_from_pypi }}
        id: wheels
        with:
          repository: ${{ inputs.repos }}
          file: "-${{ steps.info.outputs.tag }}-manylinux_2_28_x86_64.whl"
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: "pip-compile"
        uses: Geode-solutions/actions/install/cpp-pip-compile@master
        with:
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Compile
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH:PATH="${{ steps.repos.outputs.path }}" -D${{ inputs.name }}_WITH_PYTHON:BOOL=ON -DPYTHON_VERSION:STRING=${{ matrix.python }} -DWHEEL_VERSION:STRING=${{ inputs.version }} -D${{ inputs.name }}_WITH_TESTS:BOOL=OFF ..
          cmake --build . -j 2
      - name: Wheels from Github in venv
        if: ${{ !inputs.wheels_from_pypi }}
        run: |
          wheels=$(echo "${{ steps.wheels.outputs.path }}" | sed 's/\;/\ /g')
          echo $wheels
          if [ -n "$wheels" ]; then 
            build/${{ inputs.directory }}/wheel/venv/bin/pip install --no-deps $wheels
          fi
      - name: Wheels from Pypi in venv
        if: ${{ inputs.wheels_from_pypi }}
        run: |
          requirements="bindings/python/requirements.txt"
          if [ -f "$requirements" ]; then
            # A dependency released moments ago may not be served by every PyPI CDN node yet
            # (index pages are cached up to 10 min): retry, bypassing pip's cache
            pip="build/${{ inputs.directory }}/wheel/venv/bin/pip"
            attempt=1
            until $pip install --pre $([ $attempt -gt 1 ] && echo --no-cache-dir) -r $requirements; do
              if [ $attempt -ge 5 ]; then
                echo "pip install failed after $attempt attempts"
                exit 1
              fi
              echo "pip install failed (attempt $attempt/5), retrying in 60s..."
              sleep 60
              attempt=$((attempt + 1))
            done
          fi
      - name: Compile wheel
        run: |
          cd build/${{ inputs.directory }}
          cmake --build . --target wheel --config Release
          cd wheel/dist
          rename linux manylinux_2_28 *.whl
      - name: Upload GH
        if: inputs.upload-github
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          files="build/${{ inputs.directory }}/wheel/dist/*.whl"
          for file in $files
          do
            echo $file
            counter=0
            for i in 1 2 3 4 5; do gh release upload --clobber --repo $GITHUB_REPOSITORY ${{ inputs.release }} $file && break || counter=$[$counter +1] && sleep 30; done
            echo $counter
            if [ "$counter" -eq "5" ]; then exit 1; fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: PyPI
        if: inputs.upload-pypi
        run: |
          pip install twine
          twine upload -u __token__ -p ${{ secrets.PYPI_TOKEN }} --skip-existing --verbose build/${{ inputs.directory }}/wheel/dist/*.whl

  # One job for every Python version: the first wheel compiles the C++ libraries, the next ones
  # only recompile the Python bindings
  linux-python-combined:
    if: ${{ inputs.combined }}
    runs-on: ubuntu-24.04
    container: "ghcr.io/geode-solutions/rhel:master"
    env:
      CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
    steps:
      - name: Check inputs
        if: ${{ !inputs.wheels_from_pypi }}
        run: |
          echo "::error::the combined job only installs the wheels of the dependencies from PyPI"
          exit 1
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: rhel
          save: false
      - name: Libraries
        run: |
          new_path=$(echo "${{ steps.repos.outputs.path }}" | sed 's/\;/\/lib64\:/g')
          echo "LD_LIBRARY_PATH=$new_path" >> $GITHUB_ENV
      - name: Wheel 3.14
        uses: Geode-solutions/actions/cpp-python-wheel@master
        with:
          python: "3.14"
          name: ${{ inputs.name }}
          directory: ${{ inputs.directory }}
          version: ${{ inputs.version }}
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Wheel 3.13
        if: ${{ !inputs.light }}
        uses: Geode-solutions/actions/cpp-python-wheel@master
        with:
          python: "3.13"
          name: ${{ inputs.name }}
          directory: ${{ inputs.directory }}
          version: ${{ inputs.version }}
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Wheel 3.12
        if: ${{ !inputs.light }}
        uses: Geode-solutions/actions/cpp-python-wheel@master
        with:
          python: "3.12"
          name: ${{ inputs.name }}
          directory: ${{ inputs.directory }}
          version: ${{ inputs.version }}
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Wheel 3.11
        if: ${{ !inputs.light }}
        uses: Geode-solutions/actions/cpp-python-wheel@master
        with:
          python: "3.11"
          name: ${{ inputs.name }}
          directory: ${{ inputs.directory }}
          version: ${{ inputs.version }}
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Wheel 3.10
        if: ${{ !inputs.light }}
        uses: Geode-solutions/actions/cpp-python-wheel@master
        with:
          python: "3.10"
          name: ${{ inputs.name }}
          directory: ${{ inputs.directory }}
          version: ${{ inputs.version }}
          dependencies: ${{ steps.repos.outputs.path }}
      - name: Upload GH
        if: inputs.upload-github
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          for file in wheels/*.whl
          do
            echo $file
            counter=0
            for i in 1 2 3 4 5; do gh release upload --clobber --repo $GITHUB_REPOSITORY ${{ inputs.release }} $file && break || counter=$[$counter +1] && sleep 30; done
            echo $counter
            if [ "$counter" -eq "5" ]; then exit 1; fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Artifact
        if: ${{ !inputs.upload-github }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-rhel
          path: wheels/*.whl
          retention-days: 1
      - name: PyPI
        if: inputs.upload-pypi
        run: |
          pip install twine
          twine upload -u __token__ -p ${{ secrets.PYPI_TOKEN }} --skip-existing --verbose wheels/*.whl
