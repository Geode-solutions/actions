name: "Test Docker"
description: "Test Docker"

inputs:
  tag:
    type: string
    required: true
  license:
    description: "Content of the Geode license file, given to the build as the BuildKit secret geode_license"
    type: string
  token:
    description: "GitHub token given to the build as the build-arg TOKEN (e.g. to clone private data repositories)"
    type: string
outputs:
  image:
    value: ${{ steps.image.outputs.IMAGE }}

runs:
  using: "composite"
  steps:
    - name: Set IMAGE variable
      id: image
      run: |
        repo=${GITHUB_REPOSITORY,,}
        echo $repo
        echo "IMAGE=ghcr.io/$repo:${{ inputs.tag }}" >> $GITHUB_OUTPUT
      shell: bash
    - name: Build Docker image
      run: |
        args=(-t "$IMAGE" --build-arg BRANCH="$TAG")
        if [ -n "$LICENSE" ]; then
          license_file="$RUNNER_TEMP/geode_license"
          printf '%s\n' "$LICENSE" > "$license_file"
          args+=(--secret id=geode_license,src="$license_file")
        fi
        if [ -n "$TOKEN" ]; then
          args+=(--build-arg TOKEN="$TOKEN")
        fi
        # A dependency released moments ago (e.g. by a sibling repo's deploy) may not be served by
        # every PyPI/npm CDN node yet (index pages and tarballs are cached up to ~10 min): retry
        # only on those errors. npm reports E404 when the packument lists the version but the
        # tarball is not reachable yet, ETARGET when the packument does not list it yet.
        not_yet_published='No matching distribution found|npm (error|ERR!) code (E404|ETARGET)'
        log="$RUNNER_TEMP/docker-build.log"
        max_attempts=5
        for attempt in $(seq 1 $max_attempts); do
          if docker build "${args[@]}" . 2>&1 | tee "$log"; [ "${PIPESTATUS[0]}" -eq 0 ]; then
            break
          fi
          if ! grep -Eq "$not_yet_published" "$log" || [ "$attempt" -eq "$max_attempts" ]; then
            exit 1
          fi
          echo "A dependency is not available on PyPI/npm yet (attempt $attempt/$max_attempts), retrying in 60s..."
          sleep 60
        done
      shell: bash
      env:
        DOCKER_BUILDKIT: 1
        IMAGE: ${{ steps.image.outputs.IMAGE }}
        TAG: ${{ inputs.tag }}
        LICENSE: ${{ inputs.license }}
        TOKEN: ${{ inputs.token }}
