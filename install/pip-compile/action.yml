name: "Install pip-compile"
description: "Install pip-compile"

inputs:
  folders:
    type: string
    required: true
  use_internal:
    type: boolean
    required: true
  token:
    description: "Reads the releases of the internal dependencies"
    type: string
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: "pip-compile"
      run: |
        IFS=';' read -ra folders <<< "${{ inputs.folders }}"
        for folder in "${folders[@]}"; do
          echo "Current folder: $folder"
          file_in=$folder/requirements.in
          if [ ! -f "$file_in" ]; then 
            echo "File $file_in not found, skipping $folder"
            continue
          fi
          file_internal_in=$folder/requirements-internal.in
          if [ ! -f "$file_internal_in" ]; then 
            echo "File $file_internal_in not found"
            exit 1
          fi
          file_txt=$folder/requirements.txt
          rm -f $file_txt
          pip install pip-tools
          pip-compile -v $file_in --output-file $file_txt
          echo "" >> $file_txt
          packages=$(grep -E '^[^#].+==' "$file_txt" | cut -d'=' -f1 || true)
          for package in $packages; do
            echo "Package: $package"
            pkg_regex=$(echo "$package" | sed -E 's/[-_]/[-_]/g')
            if grep -qiE "^${pkg_regex}==" "$file_in" 2>/dev/null; then
              pinned_version=$(grep -iE "^${pkg_regex}==" "$file_in" | cut -d'=' -f3 || true)
              echo "Pinned version in $file_in: $pinned_version"
              continue
            fi
            echo "Updating $package version"
            perl -i -pe 's|^(\Q'"$package"'\E)==(\d+)((?:\.\d+)?(?:\.\d+)?)(?:[a-z]+[0-9]*)?$|\1==\2.*|' "$file_txt"
          done
          if [ ${{ inputs.use_internal }} == "true" ]; then
            echo "Processing $file_internal_in"
            [ "$(tail -c 1 $file_internal_in | wc -l)" -eq 0 ] && echo "" >> $file_internal_in
            while read -r package; do
              if [ -z "$package" ]; then
                continue
              fi
              echo "Package: $package"
              # Same release as wait-registry: a second PyPI query can hit a mirror that does not list it yet
              tag=$(gh api "repos/Geode-solutions/$package/releases?per_page=30" --jq '[.[] | select(.tag_name | test("^v[0-9]"))][0].tag_name' 2>/dev/null || true)
              if [ -n "$tag" ]; then
                # v1.2.3-rc.4 is published as 1.2.3rc4
                full_version=$(echo "${tag#v}" | sed -E 's/-rc\.([0-9]+)$/rc\1/')
              else
                full_version=$(pip index versions --pre $package | grep $package | cut -d'(' -f2 | cut -d')' -f1)
              fi
              echo "Full version: $full_version"
              major=$(echo "$full_version" | sed -E 's/^([0-9]+\.).*/\1/')
              echo "Major: $major"
              echo "$package==$major*,>=$full_version" >> $file_txt
            done < "$file_internal_in"
          fi
          echo "Final content of $file_txt:"
          cat $file_txt
        done
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
