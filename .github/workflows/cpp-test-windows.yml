on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      shards:
        type: number
        default: 2
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
      package:
        description: "release receiving the packages of the build (none when empty)"
        type: string
        default: ""
      test_matrix:
        description: "test matrix (shards), built by cpp-test-repository.yml"
        type: string
        required: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GEODE_CI_LICENSE:
        required: false

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: win64
      - name: Libraries
        id: libraries
        run: |
          $old_path = "${{ steps.repos.outputs.path }}"
          $bin_path = $old_path.replace(";", "\bin;")
          echo "bin=$bin_path" >> $env:GITHUB_OUTPUT
          $share_path = $old_path.replace(";", "\share;")
          echo "share=$share_path" >> $env:GITHUB_OUTPUT
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if(!(test-path build)) { mkdir build }
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DBUILD_SHARED_LIBS:BOOL=ON -DCMAKE_PREFIX_PATH="${{ steps.repos.outputs.path }}" -DCPACK_PACKAGE_VERSION:STRING=0.0.0 -DCPACK_SYSTEM_NAME:STRING=win64 ..
          cmake --build . -t third_party
          cd ${{ inputs.directory }}
          $paths = "${{ steps.libraries.outputs.bin }}"
          echo $paths
          Foreach($path in $paths.split(";")){
            if(Test-Path -Path $path) {
              Copy-Item -Path $path\* -Destination bin
            }
          }
          if(!(test-path share)) {
            mkdir share
          }
          $shares = "${{ steps.libraries.outputs.share }}"
          echo $shares
          Foreach($share in $shares.split(";")){
            if(Test-Path -Path $share) {
              Copy-Item -Path $share\* -Destination share -Recurse -Force
            }
          }
          cmake --build . -t essential -j 2
          $count = (ctest -N -L essential | Select-String "^Total Tests: (\d+)").Matches.Groups[1].Value
          echo "Essential tests: $count"
          if(!$count -or [int]$count -eq 0) {
            echo "No essential tests found"
            exit 1
          }
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      # Same private package as cpp-deploy-windows.yml (unsigned), from this build
      - name: Package
        if: ${{ inputs.package != '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd build/${{ inputs.directory }}
          cpack -D CPACK_COMPONENTS_ALL="public;private"
          Get-ChildItem *.zip | Foreach-Object {
            $private = $_.Name.Replace(".zip", "-private.zip")
            Rename-Item $_.FullName $private
            gh release upload --clobber --repo ${env:GITHUB_REPOSITORY} ${{ inputs.package }} $private
            Remove-Item $private
          }
          Remove-Item -Recurse -Force _CPack_Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A single shard runs in the build job: a test job would repeat the checkout and dependencies
      # setup and transfer the tests as an artifact
      - name: Test
        if: ${{ inputs.shards == 1 }}
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: 1
          shards: 1
          directory: build/${{ inputs.directory }}
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
      - name: Upload tests
        if: ${{ inputs.shards > 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-tests-win64
          path: |
            build
            !build/**/CMakeFiles
            !build/**/*.obj
            !build/**/*.ilk
            !build/**/*.lib
            !build/**/.ninja_*
          retention-days: 1
          overwrite: true

  test-windows:
    if: ${{ inputs.shards > 1 }}
    runs-on: windows-2022
    needs: build-windows
    strategy:
      matrix: ${{ fromJson(inputs.test_matrix) }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: win64
      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: cpp-tests-win64
          path: build
      - name: Test
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: ${{ matrix.shard }}
          shards: ${{ inputs.shards }}
          directory: build/${{ inputs.directory }}
        env:
          GEODE_LICENSE_DATA: ${{ secrets.GEODE_CI_LICENSE }}
