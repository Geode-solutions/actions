on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Notify slack
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,ref
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
