name: "Install Python dependencies"
description: "Install Python dependencies"

inputs:
  repos:
    type: string
  branch:
    type: string
  wheels:
    type: string
  use_registry:
    type: boolean
    required: true
  token:
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12
        cache: pip
    - uses: Geode-solutions/actions/get-release@master
      if: ${{ inputs.wheels == '' && inputs.use_registry == 'false' }}
      id: wheels
      with:
        repository: ${{ inputs.repos }}
        file: ".whl"
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
    - name: Get wheels
      id: result
      run: |
        if [ -n "${{ inputs.wheels }}" ]; then
          echo "wheels=${{ inputs.wheels }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ steps.wheels.outputs.path }}" ]; then
          echo "wheels=${{ steps.wheels.outputs.path }}" >> $GITHUB_OUTPUT
        else
          echo "wheels=" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - name: Install OSMesa
      uses: Geode-solutions/actions/install/osmesa@master
    - name: Install dependencies
      run: |
        echo "$PATH"
        # A dependency released moments ago may not be visible on PyPI yet:
        # retry, bypassing pip's cache which may hold a stale index page
        max_attempts=5
        for attempt in $(seq 1 $max_attempts); do
          if [ "$attempt" -eq 1 ]; then
            pip install --pre . && break
          else
            pip install --pre --no-cache-dir . && break
          fi
          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "pip install failed after $max_attempts attempts"
            exit 1
          fi
          echo "pip install failed (attempt $attempt/$max_attempts), retrying in 60s..."
          sleep 60
        done
        wheels=$(echo "${{ steps.result.outputs.wheels }}" | sed 's/\;/\ /g')
        echo "all wheels = $wheels"
        if [ -n "$wheels" ]; then 
          # dev_wheels=$(echo "$wheels" | tr ' ' '\n' | grep '0\.0\.0' || echo "")
          dev_wheels="$wheels"
          echo "dev wheels = $dev_wheels"
          if [ -n "$dev_wheels" ]; then 
            filtered_wheels=$(echo "$dev_wheels" | tr '\n' ' ' | sed 's/ $//')
            echo "filtered wheels = $filtered_wheels"
            if [ -n "$filtered_wheels" ]; then 
              for wheel in $filtered_wheels; do
                pip install --pre $wheel
              done
            fi
          fi
        fi
        pip list
      shell: bash
