on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      type:
        type: string
        default: "Debug"
      branch:
        type: string
        default: ${{ github.ref_name }}
      shards:
        type: number
        default: 2
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
      package:
        description: "release receiving the packages of the build (none when empty)"
        type: string
        default: ""
      matrix:
        description: "build matrix (Linux systems), built by cpp-test-repository.yml"
        type: string
        required: true
      test_matrix:
        description: "test matrix (systems x shards), built by cpp-test-repository.yml"
        type: string
        required: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ghcr.io/geode-solutions/${{ matrix.system }}:master
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Get info
        id: info
        run: |
          echo "name=${{ matrix.system }}" >> $GITHUB_OUTPUT
          if [ "${{ matrix.system }}" = "rhel" ]; then
            echo "lib=lib64" >> $GITHUB_OUTPUT
          else
            echo "lib=lib" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: ${{ matrix.system }}
      - name: Libraries
        id: libraries
        run: |
          new_path=$(echo "${{ steps.repos.outputs.path }}" | sed 's/\;/\/${{ steps.info.outputs.lib }}\:/g')/${{ steps.info.outputs.lib }}
          echo "LD_LIBRARY_PATH=$new_path" >> $GITHUB_ENV
      - name: Compile
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DBUILD_SHARED_LIBS:BOOL=ON -DCMAKE_PREFIX_PATH="${{ steps.repos.outputs.path }}" -D${{ inputs.name }}_WITH_TESTS:BOOL=OFF -DCMAKE_INSTALL_PREFIX:PATH="$GITHUB_WORKSPACE/build/${{ inputs.directory }}/install" -DCPACK_PACKAGE_VERSION:STRING=0.0.0 -DCPACK_SYSTEM_NAME:STRING=${{ matrix.system }} ..
          cmake --build . -t third_party
          cd ${{ inputs.directory }}
          cmake --build . -t essential
          cmake --build . -t install
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
      # Same private package as cpp-deploy-linux.yml, from this build
      - name: Package
        if: ${{ inputs.package != '' }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          cd build/${{ inputs.directory }}
          cpack -D CPACK_COMPONENTS_ALL="public;private" .
          for file in *.tar.gz
          do
            private=$(echo $file | sed 's/\.tar\.gz/\-private\.tar\.gz/g')
            mv $file $private
            counter=0
            for i in 1 2 3 4 5; do gh release upload --clobber --repo $GITHUB_REPOSITORY ${{ inputs.package }} $private && break || counter=$[$counter +1] && sleep 30; done
            if [ "$counter" -eq "5" ]; then exit 1; fi
            rm $private
          done
          rm -rf _CPack_Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compile tests
        run: |
          rm -rf $GITHUB_WORKSPACE/build/${{ inputs.directory }}/bin
          mkdir -p test
          cd test
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ inputs.type }} -DCMAKE_PREFIX_PATH:PATH="${{ steps.repos.outputs.path }};$GITHUB_WORKSPACE/build/${{ inputs.directory }}/install;$GITHUB_WORKSPACE/build" ../tests
          cmake --build . -t essential
          count=$(ctest -N -L essential | sed -n 's/^Total Tests: //p')
          echo "Essential tests: $count"
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "No essential tests found"
            exit 1
          fi
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
      # A single shard runs in the build job: a test job would repeat the container, checkout and
      # dependencies setup and transfer the tests as an artifact
      - name: Test
        if: ${{ inputs.shards == 1 }}
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: 1
          shards: 1
          directory: test
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
      - name: Package tests
        if: ${{ inputs.shards > 1 }}
        run: |
          tar --exclude='*.o' --exclude='CMakeFiles' -I 'zstd -T0' -cf tests.tar.zst test build/${{ inputs.directory }}/install
          ls -lh tests.tar.zst
      - name: Upload tests
        if: ${{ inputs.shards > 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-tests-${{ matrix.system }}
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true

  test-linux:
    if: ${{ inputs.shards > 1 }}
    runs-on: ubuntu-latest
    needs: build-linux
    container: ghcr.io/geode-solutions/${{ matrix.system }}:master
    strategy:
      matrix: ${{ fromJson(inputs.test_matrix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Get info
        id: info
        run: |
          if [ "${{ matrix.system }}" = "rhel" ]; then
            echo "lib=lib64" >> $GITHUB_OUTPUT
          else
            echo "lib=lib" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: ${{ matrix.system }}
      - name: Libraries
        run: |
          new_path=$(echo "${{ steps.repos.outputs.path }}" | sed 's/\;/\/${{ steps.info.outputs.lib }}\:/g')/${{ steps.info.outputs.lib }}
          echo "LD_LIBRARY_PATH=$new_path" >> $GITHUB_ENV
      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: cpp-tests-${{ matrix.system }}
      - name: Unpack tests
        run: |
          tar -I zstd -xf tests.tar.zst
          rm tests.tar.zst
      - name: Test
        uses: Geode-solutions/actions/test/ctest-shard@master
        with:
          shard: ${{ matrix.shard }}
          shards: ${{ inputs.shards }}
          directory: test
        env:
          GEODE_LICENSE_LOCATION: ${{ github.workspace }}/geode.lic
