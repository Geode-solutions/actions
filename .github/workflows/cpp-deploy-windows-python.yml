on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      directory:
        type: string
        default: "."
      repos:
        type: string
      version:
        type: string
        required: true
      light:
        type: boolean
        default: false
      release:
        type: string
        required: true
      wheels_from_pypi:
        type: boolean
        default: false
      upload-pypi:
        type: boolean
        default: true
      branch:
        type: string
        default: ${{ github.ref_name }}
      releases:
        description: "selection output of get-release, skips the release lookup"
        type: string
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        required: false
      TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      PYPI_TOKEN:
        required: true

jobs:
  windows-python:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - python: ${{ inputs.light && '3.10' || 'dummy' }}
          - python: ${{ inputs.light && '3.11' || 'dummy' }}
          - python: ${{ inputs.light && '3.12' || 'dummy' }}
          - python: ${{ inputs.light && '3.13' || 'dummy' }}
    steps:
      - name: Token
        uses: Geode-solutions/actions/install/token@master
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          token: ${{ secrets.TOKEN }}
      - name: Get info
        id: info
        run: |
          $tag = "cp${{ matrix.python }}-cp${{ matrix.python }}"
          $tag = $tag.Replace(".", "")
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Checkout
        uses: Geode-solutions/actions/install/checkout@master
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: Install dependencies
        uses: Geode-solutions/actions/install/cpp-dependencies@master
        id: repos
        with:
          repos: ${{ inputs.repos }}
          releases: ${{ inputs.releases }}
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
          system: win64
          save: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          pip-version: 25.2
      - uses: Geode-solutions/actions/get-release@master
        if: ${{ !inputs.wheels_from_pypi }}
        id: wheels
        with:
          repository: ${{ inputs.repos }}
          file: "-${{ steps.info.outputs.tag }}-win_amd64.whl"
          token: ${{ steps.token.outputs.token }}
          branch: ${{ inputs.branch }}
      - name: "pip-compile"
        run: |
          file=bindings/python/requirements.in
          if [ ! -f "$file" ]; then 
            exit 0
          fi
          pip install pip-tools typing_extensions
          echo $GITHUB_REF_NAME
          if [ $GITHUB_REF_NAME == "master" ]; then
            pip-compile -v --upgrade $file
          else
            pip-compile -v --pre --upgrade $file
          fi
          sed -i -E 's/==(.+)\.(.+)\.(.+)/==\1\.*,>=\1\.\2\.\3/' bindings/python/requirements.txt
        shell: bash
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Compile
        run: |
          if(!(test-path build)) { mkdir build }
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH:PATH="${{ steps.repos.outputs.path }}" -D${{ inputs.name }}_WITH_TESTS:BOOL=OFF -DWHEEL_VERSION:STRING=${{ inputs.version }} -D${{ inputs.name }}_WITH_PYTHON:BOOL=ON -DPYTHON_VERSION:STRING=${{ matrix.python }} ..
          cmake --build .
      - name: Wheels from Github in venv
        if: ${{ !inputs.wheels_from_pypi }}
        run: |
          $wheels ="${{ steps.wheels.outputs.path }}"
          if($wheels) {
            Foreach($wheel in $wheels.split(";")){
              build/${{ inputs.directory }}/wheel/venv/Scripts/pip install --no-deps $wheel
            }
          }
      - name: Wheels from Pypi in venv
        if: ${{ inputs.wheels_from_pypi }}
        run: |
          $requirements = "bindings/python/requirements.txt"
          if(test-path -Path $requirements -PathType Leaf) {
            # A dependency released moments ago may not be served by every PyPI CDN node yet
            # (index pages are cached up to 10 min): retry, bypassing pip's cache
            $pip = "build/${{ inputs.directory }}/wheel/venv/Scripts/pip"
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              if ($attempt -eq 1) { & $pip install --pre -r $requirements }
              else { & $pip install --pre --no-cache-dir -r $requirements }
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 5) { Write-Output "pip install failed after $attempt attempts"; exit 1 }
              Write-Output "pip install failed (attempt $attempt/5), retrying in 60s..."
              Start-Sleep -Seconds 60
            }
          }
      - name: Compile wheel
        run: |
          cd build/${{ inputs.directory }}
          cmake --build . --target wheel
      - name: Upload GH
        run: |
          Get-ChildItem -Path "build/${{ inputs.directory }}/wheel/dist" -Filter *.whl | Foreach-Object { gh release upload --clobber --repo ${env:GITHUB_REPOSITORY} ${{ inputs.release }} $_.FullName }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: PyPI
        if: inputs.upload-pypi
        run: |
          pip install twine
          twine upload -u __token__ -p ${{ secrets.PYPI_TOKEN }} --skip-existing --verbose build/${{ inputs.directory }}/wheel/dist/*.whl
