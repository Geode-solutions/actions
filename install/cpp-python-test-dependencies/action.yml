name: "C++ Python test dependencies"
description: >
  Set up the Python used to configure and test the Python bindings, with the Python packages of
  the dependencies installed: the Python test environment of the build sees them
  (--system-site-packages).

inputs:
  python:
    description: "Python version"
    type: string
    default: "3.14"
  repos:
    description: "Internal dependencies"
    type: string
  branch:
    type: string
    required: true
  token:
    type: string
    required: true
  wheels_from_pypi:
    description: "Install the dependencies from PyPI, else the wheels of their GitHub releases"
    type: boolean
    default: false
outputs:
  python-version:
    description: "Exact Python version"
    value: ${{ steps.python.outputs.python-version }}
  wheels:
    description: "';'-separated wheels of the dependencies (GitHub releases only)"
    value: ${{ steps.wheels.outputs.path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: ${{ inputs.python }}
        pip-version: 25.2
    - name: Tag
      id: info
      shell: bash
      run: |
        tag=cp${PYTHON_VERSION//./}
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "suffix=-$tag-$tag-win_amd64.whl" >> $GITHUB_OUTPUT
        else
          echo "suffix=-$tag-$tag-manylinux_2_28_x86_64.whl" >> $GITHUB_OUTPUT
        fi
      env:
        PYTHON_VERSION: ${{ inputs.python }}
    - uses: Geode-solutions/actions/get-release@master
      if: ${{ inputs.wheels_from_pypi != 'true' }}
      id: wheels
      with:
        repository: ${{ inputs.repos }}
        file: ${{ steps.info.outputs.suffix }}
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
    - name: pip-compile
      shell: bash
      run: |
        file=bindings/python/requirements.in
        if [ ! -f "$file" ]; then
          exit 0
        fi
        python -m pip install pip-tools typing_extensions
        if [ "$BRANCH" == "master" ]; then
          pip-compile -v --upgrade $file
        else
          pip-compile -v --pre --upgrade $file
        fi
        sed -i -E 's/==(.+)\.(.+)\.(.+)/==\1\.*,>=\1\.\2\.\3/' bindings/python/requirements.txt
      env:
        BRANCH: ${{ inputs.branch }}
    - name: Wheels from Github
      if: ${{ inputs.wheels_from_pypi != 'true' }}
      shell: bash
      run: |
        IFS=';' read -ra wheels <<< "$WHEELS"
        for wheel in "${wheels[@]}"; do
          if [ -n "$wheel" ]; then
            python -m pip install --no-deps "$wheel"
          fi
        done
      env:
        WHEELS: ${{ steps.wheels.outputs.path }}
    - name: Wheels from Pypi
      if: ${{ inputs.wheels_from_pypi == 'true' }}
      shell: bash
      run: |
        requirements="bindings/python/requirements.txt"
        if [ -f "$requirements" ]; then
          python -m pip install --pre -r $requirements
        fi
